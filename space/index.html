      ${m.gguf_list.length ? `<li>${esc(t("ggufBuilds", m.gguf_builds, m.gguf_list.length))}:<br>${m.gguf_list.map(b => badge(b.publisher, PUBLISHER[b.publisher] + (b.verified_org ? " ✓ verified" : "")) + link("https://huggingface.co/" + b.repo, b.repo) + ` <span class="src">${esc(b.downloads)} ${esc(t("downloads"))}</span>` + tpl(b)).join("<br>")}</li>` : ""}
      ${m.template_check ? `<li>${esc(t("tplLine"))}: <b>${esc(m.template_check)}</b> <span class="src">(${esc(m.template_check_detail)})</span></li>` : ""}
      ${builds ? `<li>${esc(t("mlxBuilds"))} <span class="src">(${esc(t("verifiedNote"))})</span>:<br>${builds}</li>` : ""}
    </ul>
    </div>
    ${m.flags ? `<p><b>${esc(t("flagsW"))}:</b> ${esc(m.flags)}</p>` : ""}
    ${m.hbd_involvement ? `<p><b>${esc(t("involvement"))}:</b> ${esc(m.hbd_involvement)}</p>` : ""}
    ${m.notes ? `<p><b>${esc(t("notesW"))}:</b> ${esc(m.notes)}</p>` : ""}
    ${DATA.changes.some(c => c.model === m.id) ? `<h3>${esc(t("changesW"))}</h3><ul>${DATA.changes.filter(c => c.model === m.id).map(changeLine).join("")}</ul>` : ""}`;
  document.body.classList.add("panel-open");
  $("pclose").setAttribute("aria-label", t("close"));
  $("plink").onclick = () => copyText(shareUrl(), $("plink"), t("copyModelLink"));
  $("panel").scrollTop = 0;
  $("pclose").focus();
  render();
}
function closePanel() {
  document.body.classList.remove("panel-open");
  const back = selected && document.querySelector(`tr[data-id="${CSS.escape(selected)}"]`);
  selected = null;
  history.replaceState(null, "", location.pathname + location.search);
  render();
  if (back) document.querySelector(`tr[data-id="${CSS.escape(back.dataset.id)}"]`)?.focus();
}

// ── Compare ────────────────────────────────────────────────────────────────
function renderCompare() {
  const ms = picked.map(id => DATA.models.find(m => m.id === id)).filter(Boolean);
  if (ms.length < 2) { $("compare").innerHTML = picked.length ? `<p class="src">${esc(t("cmpHint"))}</p>` : ""; return; }
  const R = t("rows");
  const fields = [
    [R.Tier, m => `<span class="tier ${esc(m.tier)}">${esc(m.tier)}</span>`],
    [R.Provider, m => esc(m.provider)], [R["Country / region"], m => esc(countryName(m.provider_country))],
    [R.Control, m => esc(m.control) + (m.majority_owner ? ` (${esc(m.majority_owner)})` : "")],
    [R.Origin, m => valueWithHelp("origin", m.origin)], [R.Licence, m => valueWithHelp("license_class", m.license_class) + `<div class="src">${esc(m.license)}</div>`],
    [R["Training data"], m => valueWithHelp("data", m.data)], [R["Training compute"], m => valueWithHelp("compute", m.compute)],
    [R["AI Act training summary"], m => esc(m.ai_act_summary)], [R["GPAI Code of Practice"], m => esc(m.cop_signatory)],
    [R["Teacher models"], m => esc(m.teacher_origin)], [R.Reproducibility, m => esc(m.recipe)],
    [R["Terms can change later"], m => esc(m.terms_can_change)], [R.Languages, m => m.languages ? esc(t("ofEu", m.eu_languages)) : esc(t("unknownW"))],
    [R.Parameters, m => esc(m.params_b)], [R.Context, m => esc(m.context)],
    ...(expert() ? [[R["4-bit weights"], m => esc(m.size_4bit_gb)],
      [R["mlx-vlm"], m => esc(m.mlx_vlm)], [R["llama.cpp"], m => esc(m.llama_cpp)], [R["Verified MLX build"], m => esc(mlxBuildText(m))]] : []),
  ];
  $("compare").innerHTML = `<h3>${esc(t("cmpTitle"))} <button id="cmpclear" class="src" style="border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer">${esc(t("cmpClear"))}</button></h3>
    <div class="tablewrap"><table><thead><tr><th></th>${ms.map(m => `<th><a href="#${esc(m.id)}">${esc(m.name)}</a></th>`).join("")}</tr></thead>
    <tbody>${fields.map(([l, f]) => `<tr><td>${esc(l)}</td>${ms.map(m => `<td>${f(m)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  $("cmpclear").onclick = () => { picked = []; render(); };
}

// ── Changes ────────────────────────────────────────────────────────────────
function changeLine(c) {
  const what = c.field === "model" ? (c.new ? t("addedOne") : t("removed")) : `${esc(c.field)}: ${esc(c.old || "–")} → ${esc(c.new || "–")}`;
  return `<li>${esc(c.date)} · <b>${esc(c.model)}</b> · ${what}${c.reason ? ` <span class="src">${esc(c.reason)}</span>` : ""}</li>`;
}
function renderChanges() {
  if (!DATA.changes.length) { $("changes").innerHTML = ""; return; }
  const byDate = {};
  for (const c of DATA.changes) (byDate[c.date] ||= []).push(c);
  const name = id => DATA.models.find(m => m.id === id)?.name || id;
  const dates = Object.keys(byDate).sort().reverse().slice(0, 6);
  const items = dates.map(d => {
    const cs = byDate[d];
    const added = cs.filter(c => c.field === "model" && c.new);
    const other = cs.filter(c => !(c.field === "model" && c.new));
    let out = "";
    if (added.length > 3)
      out += `<li>${esc(d)} · <details style="display:inline"><summary>${esc(t("added", added.length))}</summary>${added.map(c => `<a href="#${esc(c.model)}">${esc(name(c.model))}</a>`).join(", ")}</details></li>`;
    else out += added.map(changeLine).join("");
    out += other.slice(0, 8).map(changeLine).join("");
    if (other.length > 8) out += `<li class="src">${esc(d)} · +${other.length - 8} …</li>`;
    return out;
  }).join("");
  $("changes").innerHTML = `<h3>${esc(t("recent"))}</h3><ul>${items}</ul><div class="src">${esc(t("fullLog"))}</div>`;
}

// ── CSV, links, state ──────────────────────────────────────────────────────
function downloadCsv() {
  const keys = ["id","name","tier","provider","provider_country","origin","license_class","data","compute","control",
    "cop_signatory","ai_act_summary","recipe","params_b","size_4bit_gb","mlx_vlm","llama_cpp","mlx_build_verified","hf_repo"];
  const q = v => /[",\n]/.test(String(v ?? "")) ? `"${String(v).replaceAll('"', '""')}"` : String(v ?? "");
  const csv = [keys.join(","), ...CURRENT.map(m => keys.map(k => q(m[k])).join(","))].join("\n") + "\n";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = "sovereign-models.csv";
  a.click();
  URL.revokeObjectURL(a.href);
}
const SIMPLE = ["q", "country", "licence", "ctx", "kvbits", "ram", "teacher", "recipe"];
const CHECKS = ["world", "expert", "mlx", "llama", "verified"];
function saveState() {
  const p = new URLSearchParams();
  for (const id of SIMPLE) { const el = $(id); if (el.value && el.value !== el.dataset.default) p.set(id, el.value); }
  for (const id of CHECKS) if ($(id).checked) p.set(id, "1");
  const tiers = [...document.querySelectorAll("#tierchips input:checked")].map(i => i.value).join(",");
  const defaults = [...document.querySelectorAll("#tierchips input")].map(i => i.value).filter(v => DEFAULT_TIERS.includes(v)).join(",");
  if (tiers !== defaults) p.set("tiers", tiers);
  if (sortKey !== "tier" || sortDir !== 1) p.set("sort", (sortDir < 0 ? "-" : "") + sortKey);
  if (picked.length) p.set("cmp", picked.join(","));
  if (lang !== "en") p.set("lang", lang);
  const qs = p.toString();
  history.replaceState(null, "", (qs ? "?" + qs : location.pathname) + location.hash);
  syncParent();
}
// On huggingface.co the app runs in an iframe: mirror query and hash into the Space page's URL,
// so the address bar always holds a link to the current view (and the open model).
const SPACE_URL = "https://huggingface.co/spaces/here-be-dragons-ai/sovereign-models";
const embedded = window.parent !== window;
function syncParent() {
  if (embedded) window.parent.postMessage({ queryString: location.search, hash: location.hash }, "https://huggingface.co");
}
function shareUrl() {
  return (embedded || location.hostname.endsWith(".hf.space") ? SPACE_URL : location.origin + location.pathname)
    + location.search + location.hash;
}
async function copyText(text, button, label) {
  try { await navigator.clipboard.writeText(text); }
  catch {  // clipboard API blocked in the iframe: fall back to a selected textarea
    const ta = Object.assign(document.createElement("textarea"), { value: text });
    document.body.append(ta); ta.select();
    const ok = document.execCommand("copy"); ta.remove();
    if (!ok) { window.prompt(t("copyLink"), text); return; }
  }
  button.textContent = t("copied");
  setTimeout(() => button.textContent = label, 1500);
}
function loadState() {
  const p = new URLSearchParams(location.search);
  for (const id of SIMPLE) { $(id).dataset.default = $(id).value; if (p.has(id)) $(id).value = p.get(id); }
  for (const id of CHECKS) $(id).checked = p.get(id) === "1";
  if (p.has("tiers")) { const set = p.get("tiers").split(","); document.querySelectorAll("#tierchips input").forEach(i => i.checked = set.includes(i.value)); }
  if (p.has("sort")) { const s = p.get("sort"); sortDir = s.startsWith("-") ? -1 : 1; sortKey = s.replace(/^-/, ""); }
  if (p.has("cmp")) picked = p.get("cmp").split(",").filter(id => DATA.models.some(m => m.id === id)).slice(0, 4);
  if (p.get("lang") === "de") lang = "de";
}

// ── Language ───────────────────────────────────────────────────────────────
function applyLang() {
  document.documentElement.lang = lang;
  regionNames = new Intl.DisplayNames([lang], { type: "region" });
  document.querySelectorAll("[data-t]").forEach(el => { const v = t(el.dataset.t); if (el.dataset.t === "lead") el.innerHTML = v; else el.textContent = v; });
  document.querySelectorAll("[data-t-title]").forEach(el => el.title = t(el.dataset.tTitle));
  $("q").placeholder = t("searchPh");
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  $("tierlist").innerHTML = Object.keys(DATA.tiers).map(tr => `<li><b>${esc(tr)}</b>: ${esc(tierText(tr))}</li>`).join("");
  const keep = $("country").value;
  $("country").innerHTML = `<option value="">${esc(t("all"))}</option>` + [...new Set(DATA.models.map(m => m.provider_country))]
    .sort((a, b) => countryName(a).localeCompare(countryName(b), lang)).map(c => `<option value="${esc(c)}">${esc(countryName(c))}</option>`).join("");
  $("country").value = keep;
  document.title = t("title");
  renderChanges();
  if (selected) detail(selected); else render();
}

// ── Start ──────────────────────────────────────────────────────────────────
fetch("scorecard.json").then(r => r.json()).then(d => {
  DATA = d;
  $("tierchips").innerHTML = TIER_ORDER.filter(tr => tr !== "comparison" && d.models.some(m => m.tier === tr))
    .map(tr => `<label><input type="checkbox" value="${esc(tr)}" ${DEFAULT_TIERS.includes(tr) ? "checked" : ""}> ${esc(tr)}</label>`).join("");
  [...new Set(d.models.map(m => m.license_class))].sort().forEach(v => $("licence").insertAdjacentHTML("beforeend", `<option>${esc(v)}</option>`));
  $("worldbox").hidden = !d.models.some(m => m.tier === "comparison");
  loadState();
  // Sorting by click or keyboard on the column headers.
  const sortBy = k => { if (!k) return; sortDir = sortKey === k ? -sortDir : 1; sortKey = k; render(); };
  $("head").onclick = e => sortBy(e.target.closest("th")?.dataset.k);
  $("head").onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); sortBy(e.target.dataset.k); } };
  // Rows: click or Enter opens the details; the first column picks models for comparison.
  $("rows").onclick = e => {
    const box = e.target.closest("input[data-pick]");
    if (box) { const id = box.dataset.pick; picked = box.checked ? [...picked, id].slice(0, 4) : picked.filter(x => x !== id); render(); return; }
    if (e.target.closest("td.pick")) return;
    const tr = e.target.closest("tr"); if (tr) detail(tr.dataset.id);
  };
  $("rows").onkeydown = e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr")) { e.preventDefault(); detail(e.target.dataset.id); } };
  $("pclose").onclick = closePanel;
  $("backdrop").onclick = closePanel;
  document.addEventListener("keydown", e => { if (e.key === "Escape" && document.body.classList.contains("panel-open")) closePanel(); });
  $("cmpbtn").onclick = () => $("compare").scrollIntoView({ behavior: "smooth" });
  $("csv").onclick = downloadCsv;
  $("copy").onclick = () => copyText(shareUrl(), $("copy"), t("copyLink"));
  document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { lang = b.dataset.lang; applyLang(); });
  document.querySelectorAll(".filters input, .filters select").forEach(el => el.addEventListener(el.type === "search" ? "input" : "change", render));
  applyLang();
  // Deep links: #model-id opens the details.
  const open = () => { const id = decodeURIComponent(location.hash.slice(1)); if (d.models.some(m => m.id === id)) detail(id); };
  window.addEventListener("hashchange", open);
  open();
});
</script>
